apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-app
  labels:
    app: graphql-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graphql-app
  template:
    metadata:
      labels:
        app: graphql-app
    spec:
      containers:
        - name: graphql-app
          image: sunilpatra27/graphql:04102026
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-service
spec:
  type: NodePort
  selector:
    app: graphql-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080